<style>
  :root{--pink:#D72D7A;--pink-dark:#A81C5C;--navy:#142550;--ink:#0E1630;--muted:#6B7290;--paper:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--navy);
       background:linear-gradient(160deg,#142550 0%,#1d3370 65%,#4a2460 100%);color:#fff;
       min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
       text-align:center;padding:48px 16px 24px}
  img.icon{width:112px;height:112px}
  h1{font-size:40px;letter-spacing:-1px;margin:20px 0 10px}
  p.lead{font-size:18px;line-height:1.5;opacity:.88;max-width:26em;margin:0 0 32px}
  a.play{display:inline-block;background:var(--pink);color:#fff;text-decoration:none;font-weight:700;
         font-size:18px;padding:16px 32px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  a.play:hover,a.play:focus{background:var(--pink-dark)}
  p.note{font-size:14px;opacity:.7;margin:20px 0 0;min-height:1.4em}
  p.note a{color:#fff}
  footer{text-align:center;font-size:13px;padding:20px 16px 28px;opacity:.7}
  footer a{color:#fff}
</style>

<body>
<main>
  <img class="icon" src="/jadwal-bola/icon.png" alt="" width="112" height="112">
  <h1>Jadwal Bola</h1>
  <p class="lead">Jadwal pertandingan sepak bola dan saluran TV-nya, dalam jam WIB.</p>
  <a class="play" id="play" href="https://play.google.com/store/apps/details?id=bimosigit.com.jadwaltvbola">Unduh di Google Play</a>
  <p class="note" id="note"></p>
</main>
<footer>
  &copy; 2026 sigit.dev &middot; <a href="/jadwal-bola/privacy/">Kebijakan Privasi</a>
</footer>
<script>
  (function () {
    var url = document.getElementById('play').href;
    var note = document.getElementById('note');
    var stay = /[?&]tetap\b/.test(location.search);
    if (stay) return;
    note.innerHTML = 'Membuka Google Play&hellip; <a href="?tetap" id="cancel">Tetap di sini</a>';
    var timer = setTimeout(function () { location.href = url; }, 2000);
    document.getElementById('cancel').addEventListener('click', function (e) {
      e.preventDefault();
      clearTimeout(timer);
      note.textContent = '';
    });
  })();
</script>
</body>
